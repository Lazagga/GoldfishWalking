<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>환상별 승률 곡선 뷰어</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  --base: #6f6e69;
  --good: #006300; --bad: #d03b3b; --warn-bg: #fff4d6; --warn-ink: #6b4b00;
  --accent: #2a78d6; --chip-on: #0b0b0b; --chip-on-ink: #ffffff;
  --div-pos: #256abf; --div-neg: #d03b3b; --div-mid: #f0efec; --band: rgba(42,120,214,0.10);
  --edit-bg: #eef5fd;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    --base: #a3a29b;
    --good: #0ca30c; --bad: #e66767; --warn-bg: #3a2f12; --warn-ink: #f3d68a;
    --accent: #3987e5; --chip-on: #f0efec; --chip-on-ink: #0b0b0b;
    --div-pos: #5598e7; --div-neg: #e66767; --div-mid: #383835; --band: rgba(57,135,229,0.16);
    --edit-bg: #16243a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
header.banner { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--ring); }
.banner h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
.banner .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-2); font-size: 12px; }
.banner .meta b { color: var(--ink); font-weight: 600; }
.banner .caveat { margin-top: 6px; font-size: 12px; color: var(--ink-2); }
.mode { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--axis); color: var(--ink-2); }
.mode.server { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); align-items: start; }
aside { border-right: 1px solid var(--ring); background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  position: sticky; top: 0; height: 100vh; }
main { padding: 12px 16px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--ring); position: static; height: 55vh; }
}
input[type=search], input[type=number], input[type=text], select { background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px; }
input[type=search] { width: 100%; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--axis); background: transparent; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.chip[aria-pressed=true] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.chip:disabled { opacity: .45; cursor: default; }
.btn { border: 1px solid var(--axis); background: var(--surface); border-radius: 6px; padding: 3px 10px; font-size: 12px; }
.btn.primary { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.btn:disabled { opacity: .45; cursor: default; }
.small { font-size: 12px; color: var(--ink-2); }
#list { overflow: auto; flex: 1; min-height: 200px; border-top: 1px solid var(--ring); }
.row { display: grid; grid-template-columns: 18px 1fr auto; gap: 2px 8px; padding: 6px 4px; border-bottom: 1px solid var(--ring); cursor: pointer; align-items: start; }
.row:hover { background: var(--surface-2); }
.row.focus { box-shadow: inset 3px 0 0 var(--accent); }
.row .editBtn { border: 0; background: none; color: var(--ink-2); cursor: pointer; padding: 0 2px; font-size: 13px; }
.row .editBtn:hover { color: var(--accent); }
#panelChip { margin: 0 0 6px; }
#panelChip:empty { display: none; }
#srvNote:empty { display: none; }
.row.edited { background: var(--edit-bg); }
.row input { margin: 3px 0 0; }
.row .nm { font-weight: 600; overflow-wrap: anywhere; }
.row .eff { grid-column: 2 / 4; font-size: 12px; color: var(--ink-2); }
.row .d { font-size: 12px; text-align: right; white-space: nowrap; }
.dim { opacity: 0.55; }
.badge { display: inline-block; font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--axis); color: var(--ink-2); margin-left: 4px; font-weight: 500; white-space: nowrap; }
.badge.none { border-style: dashed; }
.badge.sig { border-color: var(--ink-2); color: var(--ink); }
.badge.strong { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.badge.stale { border-color: var(--warn-ink); color: var(--warn-ink); background: var(--warn-bg); }
.sgline { stroke-linecap: butt; }
.sgband { stroke-dasharray: 2 3; }
.badge.sg { border-color: #7a5af8; color: #7a5af8; }
.sgOut { display: block; grid-column: 1 / -1; font-size: 12px; color: var(--ink-2); margin: 2px 0 4px 4px; }
.refchip { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.refchip .refhash { font-family: ui-monospace, monospace; }
.badge.link { border-color: var(--accent); color: var(--accent); }
.gtag { display: inline-block; white-space: nowrap; font-size: 11px; line-height: 15px; padding: 0 5px; border-radius: 3px; margin-right: 6px; font-weight: 600; vertical-align: 1px; }
.gtag.white { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--axis); }
.gtag.blue { background: #cde2fb; color: #104281; } .gtag.red { background: #fbd5d5; color: #8a1f1f; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 12px; }
.controls label { display: inline-flex; gap: 6px; align-items: center; }
.changebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--edit-bg); border: 1px solid var(--accent); border-radius: 8px; padding: 6px 10px; position: sticky; top: 0; z-index: 6; }
.changebar .status { margin-left: auto; font-size: 12px; color: var(--ink-2); }
.progbar { position: sticky; top: 0; z-index: 7; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; gap: 4px; }
.progbar .ptxt { font-size: 12.5px; color: var(--ink); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.progbar .ptxt b { font-variant-numeric: tabular-nums; }
.progbar .ptrack { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.progbar .pfill { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s linear; }
.progbar.remote .pfill { background: var(--ink-2); }
.progbar.est .pfill { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 6px, transparent 6px 12px); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--ring); flex-wrap: wrap; }
.tab { border: 0; background: transparent; padding: 6px 12px; border-bottom: 2px solid transparent; color: var(--ink-2); }
.tab[aria-selected=true] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 10px 12px; position: relative; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; margin-bottom: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart { width: 100%; height: 380px; display: block; }
.chart.small { height: 200px; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart text.nlab { font-size: 9px; }
.tooltip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--ring); box-shadow: 0 2px 10px rgba(0,0,0,.15); border-radius: 6px; padding: 6px 8px; font-size: 12px; display: none; z-index: 5; max-width: none; }
.tooltip table { border-collapse: collapse; }
.tooltip td { padding: 1px 6px 1px 0; white-space: nowrap; }
.notice { border-radius: 6px; padding: 6px 10px; background: var(--warn-bg); color: var(--warn-ink); font-size: 12px; margin: 2px 0; }
.eq { font-size: 13px; }
.eq div { padding: 2px 0; }
table.rank { width: 100%; border-collapse: collapse; font-size: 13px; }
table.rank th, table.rank td { padding: 4px 6px; border-bottom: 1px solid var(--ring); text-align: left; }
table.rank th { white-space: nowrap; cursor: pointer; user-select: none; color: var(--ink-2); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
table.rank td.n { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
table.rank tr { cursor: pointer; }
table.rank tr:hover td { background: var(--surface-2); }
.rankwrap { max-height: 60vh; overflow: auto; }
.blocked { margin: 40px auto; max-width: 640px; text-align: center; font-size: 16px; padding: 24px; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; }
.hidden { display: none !important; }
.detail { display: grid; gap: 8px; }
.efx { border: 1px solid var(--ring); border-radius: 6px; padding: 6px 8px; }
.efx .hd { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 8px; align-items: center; margin-top: 4px; }
.editor { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.editor input[type=number] { width: 90px; }
.editor input[type=range] { width: 160px; }
.editor .orig { font-size: 11px; color: var(--muted); }
.cands { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
.cands h4 { margin: 0 0 4px; font-size: 13px; }
.cands ol { margin: 0; padding-left: 18px; font-size: 12px; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow: auto; }
.modal { background: var(--surface); border-radius: 10px; max-width: 980px; width: 100%; padding: 14px 16px; border: 1px solid var(--ring); }
.modal pre { background: var(--surface-2); padding: 8px; border-radius: 6px; overflow: auto; max-height: 260px; font-size: 12px; }
.modal pre .add { color: var(--good); } .modal pre .del { color: var(--bad); }
.heat { border-collapse: collapse; font-size: 10px; }
.heat td, .heat th { width: 22px; height: 22px; text-align: center; padding: 0; border: 1px solid var(--surface); }
.heat th.rowh { width: auto; text-align: right; padding-right: 6px; white-space: nowrap; font-size: 11px; }
.heat th.colh { height: 90px; vertical-align: bottom; font-weight: 500; }
.heat th.colh div { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-size: 10px; }
.heat td.cell { cursor: pointer; color: var(--ink); }
.heat td.nosig { opacity: .45; }
.heat td.nonef { outline: 1px dashed var(--muted); outline-offset: -3px; }
.trace { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.trace .col { max-height: 60vh; overflow: auto; font-size: 12px; border: 1px solid var(--ring); border-radius: 6px; }
.trace .ev { padding: 2px 6px; border-bottom: 1px solid var(--ring); white-space: nowrap; }
.trace .ev.div { background: var(--warn-bg); color: var(--warn-ink); font-weight: 600; }
.trace .ev.after { opacity: .75; }
.info { cursor: pointer; color: var(--accent); text-decoration: none; font-size: 12px; margin-left: 2px; }
.guide h3 { margin: 12px 0 4px; font-size: 14px; } .guide li { margin: 6px 0; } .guide li.hl { background: var(--edit-bg); }
.guide table { border-collapse: collapse; font-size: 12px; } .guide td, .guide th { border-bottom: 1px solid var(--ring); padding: 3px 8px; text-align: left; vertical-align: top; }
.sweep td { width: 64px; height: 34px; text-align: center; font-size: 11px; border: 1px solid var(--surface); color: var(--ink); }
.jsoned { width: 100%; min-height: 320px; font: 12px/1.5 ui-monospace, Consolas, monospace; background: var(--surface-2); color: var(--ink); border: 1px solid var(--axis); border-radius: 6px; padding: 6px; white-space: pre; tab-size: 4; }
.jsonwrap { display: grid; grid-template-columns: 44px 1fr; } .lnum { font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); text-align: right; padding: 7px 6px 0 0; white-space: pre; overflow: hidden; }
.bar { display: inline-block; height: 8px; background: var(--accent); border-radius: 2px; vertical-align: middle; }
</style>
</head>
<body>
<script type="application/json" id="data">/*__DATA__*/</script>
<script>window.__SERVER__ = /*__SERVER__*/null;</script>
<div id="app"></div>
<script>
"use strict";
(function () {
const DATA = JSON.parse(document.getElementById("data").textContent);
const SRV = window.__SERVER__;
const app = document.getElementById("app");
const META = DATA.meta || {};
const MAX_SEL = 4;
const BASE_ID = "__baseline__";
const SLOTS = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)"];
const SYS_KO = { fantasy: "현행", ember: "불씨", chance: "확률", choice: "선택" };
const DASH = ["", "7 4", "2 3", "10 3 2 3", "4 2", "1 3"];
const MARK = ["circle", "square", "triangle", "diamond", "cross", "tri-down"];
const GRADE_KO = { white: "백색", blue: "청색", red: "적색" };
const GRADE_ORDER = { white: 0, blue: 1, red: 2 };
const FID_KO = { exact: "", approx: "근사", none: "미모델링" };
const pct = (v, d = 1) => (v == null || isNaN(v) ? "–" : (v * 100).toFixed(d) + "%");
const pp = (v, d = 1) => (v == null || isNaN(v) ? "–" : (v >= 0 ? "+" : "−") + Math.abs(v * 100).toFixed(d) + "%p");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtX = v => (Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : (+v).toFixed(2));
let fmtXi = fmtX;
const fmtNum = v => (v == null ? "–" : Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : String(+(+v).toFixed(4)));

// ---------------- 정직성: 등급 단위 데이터 차단 ----------------
if (META.effect_mode !== "table") {
  app.innerHTML = `<div class="blocked" id="blocked">이 데이터는 등급 단위 모델로 만들어져 환상별 비교가 불가능합니다.<div class="small" style="margin-top:8px">effect_mode = ${esc(META.effect_mode)} · fantasy_effects.json 으로 다시 스캔하세요 (--effects).</div></div>`;
  window.__viewerReady = true;
  return;
}

// ---------------- 데이터 준비 ----------------
const FANTS = DATA.fantasies || [];
const BYID = Object.fromEntries(FANTS.map(f => [f.id, f]));
const FACETS = META.facets && META.facets.values && META.facets.values.length ? META.facets : null;
const TARGETS = DATA.balance_targets && DATA.balance_targets.bands ? DATA.balance_targets : null;
const strongZ = META.strong_signal_z || 3.4;
let BASE_HASH = META.data_hash || META.table_hash || null;
function facetBase(fc) { return FACETS ? DATA.baseline.by_facet[fc] : DATA.baseline.points; }
function facetCurve(fid, fc) { const c = DATA.curves[fid]; if (!c) return []; return FACETS ? (c.by_facet[fc] || []) : c.points; }
const allX = new Set();
(DATA.baseline.points || []).forEach(p => allX.add(p.x));
if (FACETS) Object.values(DATA.baseline.by_facet).forEach(a => a.forEach(p => allX.add(p.x)));
let XS = (META.x_values && META.x_values.length ? META.x_values.slice() : [...allX]).sort((a, b) => a - b);
[...allX].forEach(x => { if (!XS.includes(x)) XS.push(x); }); XS.sort((a, b) => a - b);
if (XS.every(v => Number.isInteger(v))) fmtXi = v => String(Math.round(v));
const NPT = (DATA.baseline.points[0] || {}).n || META.runs_per_point || 0;

function effText(e) {
  const v = e.value, w = e.when || {};
  let cond = "";
  if (w.turn_eq != null) cond = ` (${w.turn_eq}턴)`;
  else if (w.turn_ge != null) cond = ` (${w.turn_ge}턴부터)`;
  else if (w.turn_mod) cond = ` (짝수 턴)`;
  else if (w.base_same_digits) cond = " (기본 피해가 같은 숫자일 때)";
  const per = { items_held: "보유 소모품당", items_used_battle: "이번 전투 소모품 사용당", hp: "현재 체력 x", digit8: "숫자 8 하나당", consecutive_pairs: "연속 숫자 쌍당" }[e.per] || "";
  const sg = x => (x >= 0 ? "+" : "") + (+x).toString();
  switch (e.type) {
    case "dmg_flat": return `타격당 피해 ${sg(v)}${cond}`;
    case "dmg_mult_add": return `피해 배율 ${sg(v)}`;
    case "dmg_final_mult": return `피해 x${v}${e.condition ? " (조건부)" : ""}`;
    case "base_dmg_transform": return { mult: `기본 피해 x${v}`, digit_min: `기본 피해 숫자 최소 ${v}`, first_digit: `기본 피해 첫 자리 ${v}`, odd_even: "기본 피해 홀수 x2 / 짝수 0", zero_set: `기본 피해 0 → ${v}` }[e.op] || "기본 피해 변형";
    case "hits_add": return e.per ? `타수 +1 / ${per}${e.divisor ? " " + e.divisor + "개" : ""}` : `타수 ${sg(v)}${cond}`;
    case "combo_same_dmg_stack": return `같은 피해 연속 시 +${v} 누적`;
    case "end_turn_dmg": return `턴 종료 피해 ${per ? per + " " : ""}${v}${cond}`;
    case "player_str_add": return `내 힘 ${sg(v)}${cond}`;
    case "mirror_enemy_str": return "적이 얻은 힘만큼 내 힘 증가";
    case "moves_per_turn_add": return `턴당 이동 ${sg(v)}`;
    case "moves_per_turn_mult": return `턴당 이동 x${v}`;
    case "battle_start_moves": return `첫 턴 이동 ${sg(v)}`;
    case "carry_unused_moves": return "남은 이동 이월";
    case "battle_temp_items": return `전투 시작 임시 소모품 ${sg(v)}`;
    case "item_use_refund_chance": return `소모품 사용 시 ${pct(v, 0)} 복제`;
    case "dmg_taken_flat": return `받는 피해 ${sg(v)}/타`;
    case "dmg_taken_mult": return `받는 피해 x${v}${e.condition ? " (조건부)" : ""}`;
    case "dmg_taken_delay": return `받는 피해 ${pct(v, 0)} 지연`;
    case "def_cut_add": return `받는 피해 -${pct(v, 0)}`;
    case "monster_dmg_digit_max": return `적 숫자 최대 ${v}`;
    case "monster_str_add": return `적 힘 ${sg(v)}${cond}`;
    case "str_block": return `적 힘 증가 ${v}회 무효`;
    case "monster_skip_chance_add": return `적 무행동 ${sg(v)}`;
    case "enemy_acts_first": return "적이 먼저 행동";
    case "reflect_on_hit": return e.pct ? `받은 피해 ${pct(e.pct, 0)} 반사` : `피격마다 적에게 ${v}`;
    case "heal_on_deal": return `타격마다 회복 ${v}`;
    case "heal_on_take": return `피해 ${e.per}당 회복 ${v}`;
    case "heal_per_unused_move": return `남은 이동당 회복 ${v}`;
    case "revive_once": return "사망 시 전투 되감기 1회";
    case "battle_start_temp_copy": return "전투마다 보유 환상 임시 복사";
    case "heal_per_battle": return `전투 후 회복 ${v}`;

// v4.2 F11.5: 몬스터 체력 리포트 (원본에서 계산, 읽기 전용) — 막 × 등급 요약, 등급 간·막 간 비율, 설계 목표 비율 대조
const HP_TIERS = ["easy", "normal", "elite", "boss"];
function hpStats(a) { return a && a.length ? { n: a.length, mean: a.reduce((x, y) => x + y, 0) / a.length, min: Math.min(...a), max: Math.max(...a) } : null; }
function hpReportData(mons) {
  const g = {};
  for (const m of mons) { if (m.enabled === false || m.hp == null) continue; (g[m.act + "|" + m.tier] = g[m.act + "|" + m.tier] || []).push(+m.hp); }
  const cell = {}; for (const k in g) cell[k] = hpStats(g[k]);
  const acts = [...new Set(mons.map(m => +m.act))].sort((a, b) => a - b);
  const tierRatio = {}, actRatio = {};
  for (const a of acts) { const nm = cell[a + "|normal"]; tierRatio[a] = {}; for (const t of HP_TIERS) tierRatio[a][t] = nm && cell[a + "|" + t] ? cell[a + "|" + t].mean / nm.mean : null; }
  for (const t of HP_TIERS) { const b = cell[acts[0] + "|" + t]; actRatio[t] = {}; for (const a of acts) actRatio[t][a] = b && cell[a + "|" + t] ? cell[a + "|" + t].mean / b.mean : null; }
  const bt = (DATA.balance_targets || {}).monster_hp_ratio;
  const target = bt ? { normal: bt.normal, elite: bt.elite, boss: bt.boss } : { normal: 1, elite: 3, boss: 5 };
  return { acts, cell, tierRatio, actRatio, target, provisional: !bt || bt.provisional !== false };
}

    <td class="n">${HP_TIERS.map(t => f1(R.tierRatio[a][t])).join(" : ")}</td></tr>`).join("");

function renderSweepHeat() {

      api("/api/schema").catch(e => { throw Object.assign(e, { what: "/api/schema" }); }),
      api("/api/state").catch(e => { throw Object.assign(e, { what: "/api/state" }); }),
      api("/api/fantasies").catch(e => { throw Object.assign(e, { what: "/api/fantasies" }); })]);
    SCHEMA = schema; BASE_CFG = state.base_cfg || {};
    srvOK = true;
    SRV_STATE = state;
    S.fileEdits = fj.dirty_files || [];
    const ph = ping.data_hash || ping.table_hash;
    if (!BASE_HASH) BASE_HASH = ph;
    if (ph !== BASE_HASH) { BASE_HASH = ph; $("hashLabel").textContent = BASE_HASH.slice(0, 10) + " (스캔과 다름)"; }
    // 부가: 각자 실패해도 편집은 허용하고 배지에 '일부 기능 실패'
    const part = (what, e) => { if (!e) return; const t = apiErrText(what, e); SRVC.partial.push(t); console.error("[MatchUp] 일부 기능 실패:", t, e); };
    try { absorbFantasies(fj); } catch (e) { part("환상 정보 반영", e); }
    if (state.has_monsters) part("/api/monsters", await loadMonsters());
    part("/api/reference", await loadRef());
    try { await loadSG(); } catch (e) { part("/api/surrogate/models", e); }
  } catch (e) {
    srvOK = false;
    SRVC.fail = apiErrText(e.what || step, e);
    console.error("[MatchUp] 서버 연결 실패:", SRVC.fail, e);
  }
  window.__SRVC = SRVC;
  renderModeBadge();
}
window.__connectServer = connectServer;
(async () => {
  await connectServer();
  update();
  window.__viewerReady = true;
})();
})();
</script>
