const FID_KO = { exact: "", approx: "근사", none: "미모델링" };
const pct = (v, d = 1) => (v == null || isNaN(v) ? "–" : (v * 100).toFixed(d) + "%");
const pp = (v, d = 1) => (v == null || isNaN(v) ? "–" : (v >= 0 ? "+" : "−") + Math.abs(v * 100).toFixed(d) + "%p");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtX = v => (Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : (+v).toFixed(2));
let fmtXi = fmtX;
const fmtNum = v => (v == null ? "–" : Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : String(+(+v).toFixed(4)));

// ---------------- 정직성: 등급 단위 데이터 차단 ----------------
if (META.effect_mode !== "table") {
  app.innerHTML = `<div class="blocked" id="blocked">이 데이터는 등급 단위 모델로 만들어져 환상별 비교가 불가능합니다.<div class="small" style="margin-top:8px">effect_mode = ${esc(META.effect_mode)} · fantasy_effects.json 으로 다시 스캔하세요 (--effects).</div></div>`;
  window.__viewerReady = true;

}

// ---------------- 데이터 준비 ----------------
const FANTS = DATA.fantasies || [];
const BYID = Object.fromEntries(FANTS.map(f => [f.id, f]));
const FACETS = META.facets && META.facets.values && META.facets.values.length ? META.facets : null;

let BASE_HASH = META.data_hash || META.table_hash || null;
function facetBase(fc) { return FACETS ? DATA.baseline.by_facet[fc] : DATA.baseline.points; }

const allX = new Set();
(DATA.baseline.points || []).forEach(p => allX.add(p.x));
if (FACETS) Object.values(DATA.baseline.by_facet).forEach(a => a.forEach(p => allX.add(p.x)));
let XS = (META.x_values && META.x_values.length ? META.x_values.slice() : [...allX]).sort((a, b) => a - b);
[...allX].forEach(x => { if (!XS.includes(x)) XS.push(x); }); XS.sort((a, b) => a - b);
if (XS.every(v => Number.isInteger(v))) fmtXi = v => String(Math.round(v));
const NPT = (DATA.baseline.points[0] || {}).n || META.runs_per_point || 0;

function effText(e) {
  const v = e.value, w = e.when || {};
  let cond = "";
  if (w.turn_eq != null) cond = ` (${w.turn_eq}턴)`;
  else if (w.turn_ge != null) cond = ` (${w.turn_ge}턴부터)`;
  else if (w.turn_mod) cond = ` (짝수 턴)`;
  else if (w.base_same_digits) cond = " (기본 피해가 같은 숫자일 때)";
  const per = { items_held: "보유 소모품당", items_used_battle: "이번 전투 소모품 사용당", hp: "현재 체력 x", digit8: "숫자 8 하나당", consecutive_pairs: "연속 숫자 쌍당" }[e.per] || "";
  const sg = x => (x >= 0 ? "+" : "") + (+x).toString();
  switch (e.type) {
    case "dmg_flat": return `타격당 피해 ${sg(v)}${cond}`;
    case "dmg_mult_add": return `피해 배율 ${sg(v)}`;
    case "dmg_final_mult": return `피해 x${v}${e.condition ? " (조건부)" : ""}`;
    case "base_dmg_transform": return { mult: `기본 피해 x${v}`, digit_min: `기본 피해 숫자 최소 ${v}`, first_digit: `기본 피해 첫 자리 ${v}`, odd_even: "기본 피해 홀수 x2 / 짝수 0", zero_set: `기본 피해 0 → ${v}` }[e.op] || "기본 피해 변형";

  const body = { kind: "tune", key: TUNE.key, lo: +$("tuneLo").value, hi: +$("tuneHi").value, target: +$("tuneT").value / 100,
    runs: +$("tuneRuns").value, seed: $("tuneSeed").value || "tune", edits: S.edits, cfg_edits: S.cfgEdits, cfg_set: S.cfgSet };
  TUNE.pts = []; TUNE.res = null; TUNE.err = ""; TUNE.busy = true; renderTunePanel();
  try {
    const ev = await runJob(body, e => { if (e.type === "tune_point") { TUNE.pts.push(e); renderTunePanel(); } }, "승률 맞추기");
    if (ev && ev.type === "done") TUNE.res = ev.result; else if (ev && ev.type === "error") TUNE.err = ev.message; else if (ev) TUNE.err = "취소됨";
  } catch (e) { TUNE.err = e.message; }
  TUNE.busy = false; renderTunePanel();
}
$("btnTune").onclick = () => { $("tunePanel").classList.toggle("hidden"); renderTunePanel(); };
document.addEventListener("click", e => { const a = e.target.closest(".info"); if (a) { e.preventDefault(); e.stopPropagation(); openGuide(a.dataset.g); } }, true);
$("btnSave").onclick = saveScenario; $("btnLoad").onclick = loadScenario; $("btnFull").onclick = startFull; $("btnApply").onclick = openApply; $("btnUnapply").onclick = unapply;
document.addEventListener("keydown", e => { if (!(SRV && srvOK) || e.target.tagName === "INPUT") return; if ((e.ctrlKey || e.metaKey) && e.key === "z") $("btnUndo").click(); if ((e.ctrlKey || e.metaKey) && e.key === "y") $("btnRedo").click(); });
window.addEventListener("hashchange", () => { readHash(); update(); });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(update, 80); });
$("sort").value = S.sort;
window.__S = S; window.__LIVE = LIVE; window.__JS = JS; window.__BYID = BYID; window.__SG = SG;

applyModelFidelity(); FANTS.forEach(summarize);

// ---------------- 서버 연결 (v4.3 F13.5: 필수·부가 분리, 원인 표시, 다시 연결 / F13.6: build 확인) ----------------
async function connectServer() {
  if (!(SRV && location.protocol.startsWith("http"))) { renderModeBadge(); return; }
  SRVC.fail = null; SRVC.partial = [];
  let step = "/api/ping";
  try {   // 필수: ping, 스키마, 상태, 환상 목록 — 하나라도 실패하면 읽기 전용
    const ping = await api("/api/ping");
    if (!SRVC.build) { SRVC.build = ping.build || null; } else checkBuild(ping);
    SRVC.started = ping.started_at || null; SRVC.sim = ping.sim_version;
    step = "/api/schema · /api/state · /api/fantasies";
    const [schema, state, fj] = await Promise.all([
      api("/api/schema").catch(e => { throw Object.assign(e, { what: "/api/schema" }); }),
      api("/api/state").catch(e => { throw Object.assign(e, { what: "/api/state" }); }),
      api("/api/fantasies").catch(e => { throw Object.assign(e, { what: "/api/fantasies" }); })]);
    SCHEMA = schema; BASE_CFG = state.base_cfg || {};
    srvOK = true;
    SRV_STATE = state;
    S.fileEdits = fj.dirty_files || [];
    const ph = ping.data_hash || ping.table_hash;
    if (!BASE_HASH) BASE_HASH = ph;
    if (ph !== BASE_HASH) { BASE_HASH = ph; $("hashLabel").textContent = BASE_HASH.slice(0, 10) + " (스캔과 다름)"; }
    // 부가: 각자 실패해도 편집은 허용하고 배지에 '일부 기능 실패'
    const part = (what, e) => { if (!e) return; const t = apiErrText(what, e); SRVC.partial.push(t); console.error("[MatchUp] 일부 기능 실패:", t, e); };
    try { absorbFantasies(fj); } catch (e) { part("환상 정보 반영", e); }
    if (state.has_monsters) part("/api/monsters", await loadMonsters());
    part("/api/reference", await loadRef());
    try { await loadSG(); } catch (e) { part("/api/surrogate/models", e); }
  } catch (e) {
    srvOK = false;
    SRVC.fail = apiErrText(e.what || step, e);
    console.error("[MatchUp] 서버 연결 실패:", SRVC.fail, e);
  }
  window.__SRVC = SRVC;
  renderModeBadge();
}
window.__connectServer = connectServer;
(async () => {
  await connectServer();
  update();
  window.__viewerReady = true;
})();
