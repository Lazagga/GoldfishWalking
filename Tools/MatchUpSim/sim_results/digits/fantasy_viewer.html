function binCI(p, n) { const h = 1.96 * Math.sqrt(Math.max(p * (1 - p), 0) / n); return [Math.max(0, p - h), Math.min(1, p + h)]; }

$("btnUndo").onclick = () => { if (!S.undo.length) return; S.redo.push(JSON.stringify({ e: S.edits, c: S.cfgEdits, s: S.cfgSet })); applyEditsSnapshot(S.undo.pop()); };
$("btnRedo").onclick = () => { if (!S.redo.length) return; S.undo.push(JSON.stringify({ e: S.edits, c: S.cfgEdits, s: S.cfgSet })); applyEditsSnapshot(S.redo.pop()); };
$("btnRevertAll").onclick = () => { pushUndo(); S.edits = []; S.cfgEdits = []; S.cfgSet = {}; afterEditChange(); };
$("system").addEventListener("change", e => setSystem(e.target.value));
$("dmodel").addEventListener("change", e => setModel(e.target.value));
$("rcMode").addEventListener("change", e => { S.rcMode = e.target.value; });
$("btnRecompute").onclick = () => { clearTimeout(recomputeTimer); startRecompute(); };
// ---------------- 목표 승률 맞추기 (v4.2 F11.6) ----------------
const TUNE = { key: "monsters.hp_scale", pts: [], res: null, busy: false, err: "" };
const TUNE_KEYS = { "monsters.hp_scale": { label: "몬스터 체력 배율", lo: 0.5, hi: 2, step: 0.05 }, "player.start_hp": { label: "시작 체력", lo: 50, hi: 600, step: 10 } };
function renderTunePanel() {
  const el = $("tunePanel"); if (el.classList.contains("hidden")) return;
  const K = TUNE_KEYS[TUNE.key], R = TUNE.res;
  const tbl = R && R.table ? `<div class="rankwrap" style="max-height:30vh"><table class="rank" id="tuneTable"><thead><tr><th>막</th><th>등급</th><th>종</th><th>현재 평균</th><th>환산 평균</th><th>환산 최소~최대</th></tr></thead><tbody>${R.table.summary.map(r => `<tr><td>${r.act}</td><td>${esc(r.tier)}</td><td class="n">${r.n}</td><td class="n">${r.hp_mean}</td><td class="n">${r.scaled_mean}</td><td class="n">${r.scaled_min}~${r.scaled_max}</td></tr>`).join("")}</tbody></table></div>
    <button class="btn" id="tuneCopy">몬스터별 환산 체력 표 복사 (TSV)</button>` : "";
  const res = R ? `<div id="tuneResult"><b>${esc(K.label)} = ${fmtNum(R.found)}</b> (현재 ${fmtNum(R.current)}) · 승률 ${pct(R.win_rate, 1)} [95% CI ${pct(R.ci[0], 1)}~${pct(R.ci[1], 1)}] · ${R.runs.toLocaleString()}판 × 평가 ${R.evals.length}회 · 종료: ${esc(R.stop)}${R.in_range ? "" : ' · <b id="tuneNoSol">범위 안에 해 없음</b>'}</div>${tbl}` : "";
  el.innerHTML = `<b>목표 승률 맞추기</b> <span class="small">— 필요한 값을 찾아 보여 주기만 합니다. 몬스터 JSON·설정·시나리오는 바꾸지 않습니다(반영은 몬스터 탭에서 직접).</span>
    <div class="controls" style="padding:4px 0">
      <label>대상 <select id="tuneKey">${Object.entries(TUNE_KEYS).map(([k, v]) => `<option value="${k}"${k === TUNE.key ? " selected" : ""}>${v.label} (${k})</option>`).join("")}</select></label>
      <label>범위 <input type="number" id="tuneLo" class="num" style="width:70px" step="${K.step}" value="${K.lo}"> ~ <input type="number" id="tuneHi" class="num" style="width:70px" step="${K.step}" value="${K.hi}"></label>
      <label>목표 승률 <input type="number" id="tuneT" class="num" style="width:60px" step="0.5" value="${+(S.T * 100).toFixed(2)}">%</label>
      <label>판 수 <input type="number" id="tuneRuns" class="num" style="width:70px" step="100" value="1000"></label>
      <label>시드 <input type="text" id="tuneSeed" style="width:70px" value="tune"></label>
      <button class="btn primary" id="tuneRun"${TUNE.busy ? " disabled" : ""}>실행</button> <button class="btn" id="tuneCancel"${TUNE.busy ? "" : " disabled"}>취소</button>
    </div>
    <div class="small" id="tunePts">${TUNE.pts.map(p => `${fmtNum(p.x)} → ${pct(p.win_rate, 1)}`).join(" · ")}${TUNE.busy ? " …" : ""}</div>${TUNE.err ? `<div class="small" id="tuneErr">${esc(TUNE.err)}</div>` : ""}${res}`;
  $("tuneKey").onchange = e => { TUNE.key = e.target.value; renderTunePanel(); };
  $("tuneRun").onclick = startTune;
  $("tuneCancel").onclick = () => cancelJob();
  if ($("tuneCopy")) $("tuneCopy").onclick = () => {
    const tsv = ["id\tname\tact\ttier\thp\tscaled"].concat(R.table.monsters.map(m => [m.id, m.name, m.act, m.tier, m.hp, m.scaled].join("\t"))).join("\n");
    window.__tuneTsv = tsv;
    (navigator.clipboard ? navigator.clipboard.writeText(tsv) : Promise.reject()).then(() => flash("환산 체력 표를 복사했습니다"), () => flash("복사 실패 — 표를 직접 선택해 복사하세요"));
  };
}
async function startTune() {
  cancelJob();
  const body = { kind: "tune", key: TUNE.key, lo: +$("tuneLo").value, hi: +$("tuneHi").value, target: +$("tuneT").value / 100,
    runs: +$("tuneRuns").value, seed: $("tuneSeed").value || "tune", edits: S.edits, cfg_edits: S.cfgEdits, cfg_set: S.cfgSet };
  TUNE.pts = []; TUNE.res = null; TUNE.err = ""; TUNE.busy = true; renderTunePanel();
  try {
    const ev = await runJob(body, e => { if (e.type === "tune_point") { TUNE.pts.push(e); renderTunePanel(); } }, "승률 맞추기");
    if (ev && ev.type === "done") TUNE.res = ev.result; else if (ev && ev.type === "error") TUNE.err = ev.message; else if (ev) TUNE.err = "취소됨";
  } catch (e) { TUNE.err = e.message; }
  TUNE.busy = false; renderTunePanel();
}
$("btnTune").onclick = () => { $("tunePanel").classList.toggle("hidden"); renderTunePanel(); };
document.addEventListener("click", e => { const a = e.target.closest(".info"); if (a) { e.preventDefault(); e.stopPropagation(); openGuide(a.dataset.g); } }, true);
$("btnSave").onclick = saveScenario; $("btnLoad").onclick = loadScenario; $("btnFull").onclick = startFull; $("btnApply").onclick = openApply; $("btnUnapply").onclick = unapply;
document.addEventListener("keydown", e => { if (!(SRV && srvOK) || e.target.tagName === "INPUT") return; if ((e.ctrlKey || e.metaKey) && e.key === "z") $("btnUndo").click(); if ((e.ctrlKey || e.metaKey) && e.key === "y") $("btnRedo").click(); });
window.addEventListener("hashchange", () => { readHash(); update(); });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(update, 80); });
$("sort").value = S.sort;
window.__S = S; window.__LIVE = LIVE; window.__JS = JS; window.__BYID = BYID; window.__SG = SG;
window.__setPreview = P => setPreview(P);
applyModelFidelity(); FANTS.forEach(summarize);
update();

// ---------------- 서버 연결 (v4.3 F13.5: 필수·부가 분리, 원인 표시, 다시 연결 / F13.6: build 확인) ----------------
async function connectServer() {
  if (!(SRV && location.protocol.startsWith("http"))) { renderModeBadge(); return; }
  SRVC.fail = null; SRVC.partial = [];
  let step = "/api/ping";
  try {   // 필수: ping, 스키마, 상태, 환상 목록 — 하나라도 실패하면 읽기 전용
    const ping = await api("/api/ping");
    if (!SRVC.build) { SRVC.build = ping.build || null; } else checkBuild(ping);
    SRVC.started = ping.started_at || null; SRVC.sim = ping.sim_version;
    step = "/api/schema · /api/state · /api/fantasies";
    const [schema, state, fj] = await Promise.all([
      api("/api/schema").catch(e => { throw Object.assign(e, { what: "/api/schema" }); }),
      api("/api/state").catch(e => { throw Object.assign(e, { what: "/api/state" }); }),
      api("/api/fantasies").catch(e => { throw Object.assign(e, { what: "/api/fantasies" }); })]);
    SCHEMA = schema; BASE_CFG = state.base_cfg || {};
    srvOK = true;
    SRV_STATE = state;
    S.fileEdits = fj.dirty_files || [];
    const ph = ping.data_hash || ping.table_hash;
    if (!BASE_HASH) BASE_HASH = ph;
    if (ph !== BASE_HASH) { BASE_HASH = ph; $("hashLabel").textContent = BASE_HASH.slice(0, 10) + " (스캔과 다름)"; }
    // 부가: 각자 실패해도 편집은 허용하고 배지에 '일부 기능 실패'
    const part = (what, e) => { if (!e) return; const t = apiErrText(what, e); SRVC.partial.push(t); console.error("[MatchUp] 일부 기능 실패:", t, e); };
    try { absorbFantasies(fj); } catch (e) { part("환상 정보 반영", e); }
    if (state.has_monsters) part("/api/monsters", await loadMonsters());
    part("/api/reference", await loadRef());
    try { await loadSG(); } catch (e) { part("/api/surrogate/models", e); }
  } catch (e) {
    srvOK = false;
    SRVC.fail = apiErrText(e.what || step, e);
    console.error("[MatchUp] 서버 연결 실패:", SRVC.fail, e);
  }
  window.__SRVC = SRVC;
  renderModeBadge();
}
window.__connectServer = connectServer;
(async () => {
  await connectServer();
  update();
  window.__viewerReady = true;
})();
})();
